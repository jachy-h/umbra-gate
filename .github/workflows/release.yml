name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-ref.outputs.tag }}
      version: ${{ steps.release-ref.outputs.version }}
      sha: ${{ steps.release-ref.outputs.sha }}
    steps:
      # Fetch tags before resolving a manually requested release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and resolve the release tag
        id: release-ref
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $SEMVER ]]; then
            echo "Release tag must be SemVer (for example v1.2.3): $TAG" >&2
            exit 1
          fi
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Push event tag does not match release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # For manual dispatch, this replaces the branch initially selected in
      # the UI with the exact commit that the requested tag references.
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release-ref.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm checked-out commit
        env:
          RELEASE_SHA: ${{ steps.release-ref.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js LTS
        run: |
          source "${NVM_DIR:?NVM_DIR is required on ubuntu-latest}/nvm.sh"
          nvm install --lts
          nvm use --lts
          echo "$(dirname "$(command -v node)")" >> "$GITHUB_PATH"

      - name: Run production release verification
        env:
          RELEASE_TAG: ${{ steps.release-ref.outputs.tag }}
        run: make release-verify TAG="$RELEASE_TAG"

  release:
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.verify-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm checked-out release commit
        env:
          RELEASE_SHA: ${{ needs.verify-release.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js LTS
        run: |
          source "${NVM_DIR:?NVM_DIR is required on ubuntu-latest}/nvm.sh"
          nvm install --lts
          nvm use --lts
          echo "$(dirname "$(command -v node)")" >> "$GITHUB_PATH"

      - name: Build frontend (embedded into the Go binary)
        run: |
          cd web
          npm ci
          npm run build
          # Sanity-check the Vite output is visible to the Go embed directive.
          test -f ../internal/web/dist/index.html

      - name: Build release archives
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist stage

          build_archive() {
            local goarch="$1"
            local asset_arch="$2"
            local archive="umbragate_Darwin_${asset_arch}.tar.gz"
            local root="stage/${asset_arch}"

            rm -rf "$root"
            mkdir -p "$root"

            # Frontend assets built above are embedded at compile time, so the
            # resulting binary is fully self-contained.
            CGO_ENABLED=0 GOOS=darwin GOARCH="$goarch" go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$root/umbragate" .
            cp config.yaml "$root/config.yaml"
            tar -C "$root" -czf "dist/${archive}" umbragate config.yaml
          }

          build_archive arm64 arm64
          build_archive amd64 x86_64

          (cd dist && shasum -a 256 umbragate_Darwin_arm64.tar.gz umbragate_Darwin_x86_64.tar.gz > sha256sums.txt)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.verify-release.outputs.tag }}
          files: |
            dist/umbragate_Darwin_arm64.tar.gz
            dist/umbragate_Darwin_x86_64.tar.gz
            dist/sha256sums.txt

  update-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check whether tap token is configured
        id: tap_token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.tap_token.outputs.configured == 'true'
        with:
          repository: jachy-h/homebrew-umbragate
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download release checksums
        if: steps.tap_token.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v${{ needs.release.outputs.version }}" --repo jachy-h/umbra-gate --pattern sha256sums.txt --dir dist

      - name: Update formula
        if: steps.tap_token.outputs.configured == 'true'
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          ARM_SHA=$(grep 'umbragate_Darwin_arm64.tar.gz' dist/sha256sums.txt | awk '{print $1}')
          AMD_SHA=$(grep 'umbragate_Darwin_x86_64.tar.gz' dist/sha256sums.txt | awk '{print $1}')
          FORMULA="tap/Formula/umbragate.rb"

          perl -0pi -e 's/version ".*?"/version "'"$VERSION"'"/' "$FORMULA"
          perl -0pi -e 's#url ".*/umbragate_Darwin_arm64.tar.gz"#url "https://github.com/jachy-h/umbra-gate/releases/download/v'"$VERSION"'/umbragate_Darwin_arm64.tar.gz"#' "$FORMULA"
          perl -0pi -e 's#url ".*/umbragate_Darwin_x86_64.tar.gz"#url "https://github.com/jachy-h/umbra-gate/releases/download/v'"$VERSION"'/umbragate_Darwin_x86_64.tar.gz"#' "$FORMULA"
          ruby -e '
            formula = File.read(ARGV[0])
            arm_sha = ARGV[1]
            amd_sha = ARGV[2]
            lines = formula.lines
            arm_index = lines.index { |line| line.include?("Darwin_arm64.tar.gz") }
            amd_index = lines.index { |line| line.include?("Darwin_x86_64.tar.gz") }
            raise "arm64 url line not found" unless arm_index
            raise "x86_64 url line not found" unless amd_index
            lines[arm_index + 1] = "      sha256 \"#{arm_sha}\"\n"
            lines[amd_index + 1] = "      sha256 \"#{amd_sha}\"\n"
            File.write(ARGV[0], lines.join)
          ' "$FORMULA" "$ARM_SHA" "$AMD_SHA"

      - name: Commit and push formula update
        if: steps.tap_token.outputs.configured == 'true'
        run: |
          set -euo pipefail
          cd tap
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/umbragate.rb
          git commit -m "chore: update umbragate v${{ needs.release.outputs.version }}"
          git push
